name: Trigger INVENDIS product sync

on:
  push:
    branches: [main]
    paths:
      - 'data/products.json'

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch to INVENDIS-Technologies
        run: |
          curl -X POST \
            -H "Authorization: Bearer ${{ secrets.INVENDIS_SYNC_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/ananthr99/INVENDIS-Technologies/dispatches \
            -d '{"event_type":"product-sync"}'
