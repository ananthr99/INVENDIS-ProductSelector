name: Cache Bust

on:
  push:
    branches: [main]
    paths:
      - 'js/**'
      - 'products.js'
      - 'admin/**'

jobs:
  cache-bust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Inject git SHA as cache-bust version
        run: |
          SHA=$(git rev-parse --short HEAD)
          sed -i "s/__VER__/$SHA/g" index.html
          echo "Replaced __VER__ with $SHA"

      - name: Commit updated index.html
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --staged --quiet || git commit -m "chore: cache-bust [skip ci]"
          git push
